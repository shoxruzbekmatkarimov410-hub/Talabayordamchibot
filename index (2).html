<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talaba AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f2f4fb;--card:#fff;--ink:#141a33;--mute:#6b7396;--line:#e1e5f3;--pri:#4b46e5;--on:#fff;--soft:#e9e8ff;--ok:#12a36b;--bad:#d9425a;--grid:#d9dcf2;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1026;--card:#161a38;--ink:#eef0ff;--mute:#8f97c4;--line:#252a52;--pri:#8183ff;--on:#0d1026;--soft:#23275a;--ok:#3ddc97;--bad:#ff7088;--grid:#232850}}
:root[data-theme=dark]{--bg:#0d1026;--card:#161a38;--ink:#eef0ff;--mute:#8f97c4;--line:#252a52;--pri:#8183ff;--on:#0d1026;--soft:#23275a;--ok:#3ddc97;--bad:#ff7088;--grid:#232850}
*{box-sizing:inherit;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0)}
#view{padding:16px 16px calc(110px + env(safe-area-inset-bottom,0));max-width:560px;margin:auto}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:15px;font-weight:700;margin:22px 0 10px}
.sub{color:var(--mute);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.hero{margin-top:16px;border-radius:22px;padding:22px 20px;background-color:var(--card);border:1px solid var(--line);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;position:relative}
.hero h1{font-size:26px;max-width:15ch}
.hero p{margin:8px 0 16px;color:var(--mute);max-width:30ch}
.btn{background:var(--pri);color:var(--on);font-weight:700;border-radius:14px;padding:13px 20px}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--soft);color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;text-align:center;position:relative}
.ico{width:100%;aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-size:26px;background:hsl(var(--h) 80% 92%)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .ico{background:hsl(var(--h) 35% 22%)}}
:root[data-theme=dark] .ico{background:hsl(var(--h) 35% 22%)}
.tile.off{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--pri)}
.badge.done{color:var(--ok)}.badge.failed{color:var(--bad)}
.bal{font-size:40px;font-weight:800;letter-spacing:-.02em}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0));max-width:536px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;padding:6px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:6px 0;font-weight:600}
nav button span{font-size:20px}
nav button.on{color:var(--pri)}
nav .plus{width:56px;height:56px;margin:-26px auto 0;border-radius:20px;background:var(--pri);color:var(--on);font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:0 8px 20px -6px var(--pri)}
#sheet{position:fixed;inset:0;background:rgba(5,8,30,.55);display:none;align-items:flex-end;z-index:5}
#sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0));max-width:560px;margin:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}
textarea{width:100%;min-height:90px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font:inherit;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.opt.on{border-color:var(--pri);background:var(--soft);color:var(--pri)}
.opts{display:grid;gap:8px}
.opts .opt{display:flex;justify-content:space-between;text-align:left}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:9;display:none;max-width:90%;text-align:center}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.steps{margin:6px 0 0 18px;color:var(--mute);font-size:14px;display:grid;gap:6px}
.inp{width:100%;margin-top:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font:inherit}
.amts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumb{max-width:100%;max-height:220px;border-radius:12px;margin-top:12px;display:block}
.note{background:var(--soft);color:var(--pri);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:12px}
</style>
</head>
<body>
<div id="view"></div>
<nav id="nav"></nav>
<div id="sheet"><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme; }
const S = { tab: "home", me: null, tools: [], langs: {}, jobs: [], topups: [], form: null };
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm";
const $ = id => document.getElementById(id);

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 2800); }
async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "Authorization": "tma " + (tg ? tg.initData : ""), "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "Server xatosi (" + r.status + "). Birozdan so'ng urinib ko'ring");
  return j;
}
const copy = async t => { try { await navigator.clipboard.writeText(t); toast("Nusxalandi"); } catch { toast(t); } };
const split = t => { const i = t.indexOf(" "); return [t.slice(0, i), t.slice(i + 1)]; };

function tile(t) {
  const [ico, name] = split(t.title);
  const hue = (t.key.length * 47 + t.key.charCodeAt(0) * 13) % 360;
  return h("button", { class: "tile" + (t.enabled === false ? " off" : ""), onclick: () => openTool(t) },
    h("div", { class: "ico", style: "--h:" + hue }, ico), name);
}
function setTab(t) { S.tab = t; render(); }

function renderNav() {
  const b = (id, ico, label) => h("button", { class: S.tab === id ? "on" : "", onclick: () => setTab(id) }, h("span", {}, ico), label);
  $("nav").replaceChildren(b("home", "🏠", "Bosh"), b("jobs", "📂", "Ishlarim"),
    h("button", { class: "plus", "aria-label": "Yangi ish", onclick: openPicker }, "+"),
    b("wallet", "👛", "Hamyon"), b("profile", "🙂", "Profil"));
}

function home() {
  const main = S.tools.filter(t => t.group === "main"), more = S.tools.filter(t => t.group === "more");
  return [
    h("div", { class: "top" }, h("div", {}, h("div", { class: "sub" }, "Salom,"), h("h1", {}, S.me.name)),
      h("button", { class: "chip", onclick: () => setTab("wallet") }, "💰 " + fmt(S.me.balance))),
    h("div", { class: "hero" }, h("h1", {}, "Hujjatingiz bir necha daqiqada tayyor"),
      h("p", {}, "Slayd, referat, mustaqil ish va boshqalar. Narxni oldindan ko'rasiz."),
      h("button", { class: "btn", onclick: openPicker }, "Yangi ish boshlash")),
    h("h2", {}, "Asosiy vositalar"), h("div", { class: "grid" }, main.map(tile)),
    h("h2", {}, "Boshqa vositalar"), h("div", { class: "grid" }, more.map(tile))
  ];
}

function jobsView() {
  const st = { done: "Tayyor", failed: "Xato", running: "Tayyorlanmoqda" };
  return [h("h1", {}, "Ishlarim"), h("p", { class: "sub" }, "Tayyor fayl bot chatiga yuboriladi."),
    S.jobs.length ? h("div", { class: "card", style: "margin-top:14px" }, S.jobs.map(j =>
      h("div", { class: "row" }, h("div", {}, h("div", { style: "font-weight:700" }, j.tool), h("div", { class: "sub" }, j.topic)),
        h("span", { class: "badge " + j.status }, st[j.status] || j.status))))
      : h("div", { class: "empty" }, h("div", { style: "font-size:40px" }, "📂"), h("p", {}, "Hozircha ish yo'q"),
        h("button", { class: "btn", style: "margin-top:14px", onclick: openPicker }, "Birinchi ishni yarating"))];
}

function walletView() {
  const m = S.me, st = { pending: "Kutilmoqda", approved: "Tasdiqlandi", rejected: "Rad etildi" };
  return [h("h1", {}, "Hamyon"),
    h("div", { class: "card", style: "margin-top:14px" }, h("div", { class: "sub" }, "Balans"), h("div", { class: "bal" }, fmt(m.balance)),
      h("button", { class: "btn", style: "margin-top:14px;width:100%", onclick: openTopup }, "Balansni to'ldirish"),
      h("div", { class: "note" }, "Har to'ldirishga +" + m.bonus + "% bonus")),
    h("h2", {}, "So'nggi to'lovlar"),
    S.topups.length ? h("div", { class: "card" }, S.topups.map(t => h("div", { class: "row" }, h("b", {}, fmt(t.amount)),
      h("span", { class: "badge " + (t.status === "approved" ? "done" : t.status === "rejected" ? "failed" : "") }, st[t.status] || t.status))))
      : h("div", { class: "card sub" }, "Hozircha to'lovlar yo'q"),
    h("h2", {}, "Do'stlarni taklif qilish"),
    h("div", { class: "card" }, h("p", { class: "sub" }, "Do'stingiz balansini to'ldirganda sizga " + m.ref + "% bonus beriladi."),
      h("button", { class: "btn ghost", style: "margin-top:12px", onclick: shareRef }, "Havolani ulashish"))];
}
async function loadTopups() { try { S.topups = await api("/api/topups"); if (S.tab === "wallet") $("view").replaceChildren(...walletView()); } catch (e) {} }

const AMOUNTS = [10000, 25000, 50000, 100000];
function openTopup() { S.tp = { amount: 25000, custom: "", b64: null, prev: null }; topupStep1(); }
function topupStep1() {
  const t = S.tp, m = S.me;
  const info = h("div", { class: "note" }), go = h("button", { class: "btn", style: "width:100%;margin-top:16px", onclick: topupStep2 }, "Davom etish");
  const upd = () => {
    const ok = t.amount >= 1000 && t.amount <= 10000000, bonus = Math.floor(t.amount * m.bonus / 100);
    info.textContent = ok ? `To'lov: ${fmt(t.amount)}. Bonus: +${fmt(bonus)}. Balansga tushadi: ${fmt(t.amount + bonus)}` : "Summa 1 000 dan 10 000 000 so'mgacha bo'lsin";
    go.disabled = !ok;
  };
  const inp = h("input", { class: "inp", type: "number", inputmode: "numeric", placeholder: "Boshqa summa (so'm)", value: t.custom,
    oninput: e => { t.custom = e.target.value; t.amount = parseInt(e.target.value) || 0; upd(); } });
  upd();
  sheet.open([h("h1", {}, "Balansni to'ldirish"), h("h2", {}, "Summani tanlang"),
    h("div", { class: "amts" }, AMOUNTS.map(a => h("button", { class: "opt" + (t.amount === a && !t.custom ? " on" : ""), onclick: () => { t.amount = a; t.custom = ""; topupStep1(); } }, fmt(a)))),
    inp, info, go]);
}
async function shrink(file) {
  const bmp = await createImageBitmap(file), k = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.82); return { b64: url.split(",")[1], url };
}
function topupStep2() {
  const t = S.tp, m = S.me;
  const send = h("button", { class: "btn", style: "width:100%;margin-top:16px", onclick: sendTopup }, "Chekni yuborish");
  send.disabled = !t.b64;
  const file = h("input", { type: "file", accept: "image/*", style: "display:none", onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const r = await shrink(f); t.b64 = r.b64; t.prev = r.url; topupStep2(); } catch (err) { toast("Rasmni o'qib bo'lmadi, boshqa rasm tanlang"); }
  } });
  sheet.open([h("h1", {}, fmt(t.amount)), h("p", { class: "sub" }, "Shu summani quyidagi rekvizitga o'tkazing:"),
    h("div", { class: "card", style: "margin-top:12px" }, h("div", { style: "font-weight:700;white-space:pre-line" }, m.card_info),
      h("button", { class: "btn ghost", style: "margin-top:12px", onclick: () => copy(m.card_info) }, "Nusxalash")),
    h("h2", {}, "To'lov chekini yuklang"), file,
    h("button", { class: "btn ghost", style: "width:100%", onclick: () => file.click() }, t.b64 ? "Boshqa rasm tanlash" : "Chek rasmini tanlash"),
    t.prev ? h("img", { class: "thumb", src: t.prev, alt: "Chek" }) : null, send,
    h("button", { class: "opt", style: "width:100%;margin-top:10px;justify-content:center", onclick: topupStep1 }, "Summani o'zgartirish")]);
}
async function sendTopup(e) {
  e.target.disabled = true;
  try {
    await api("/api/topup", { amount: S.tp.amount, image: S.tp.b64 });
    sheet.close(); toast("Chek adminga yuborildi. Tasdiqlangach balans to'ldiriladi"); loadTopups();
  } catch (err) { e.target.disabled = false; toast(err.message); }
}
setInterval(() => { if (S.tab === "wallet" && S.topups.some(t => t.status === "pending")) { loadTopups(); refreshMe(); } }, 8000);
async function refreshMe() { try { S.me = await api("/api/me"); if (S.tab === "wallet") $("view").replaceChildren(...walletView()); } catch (e) {} }
const refLink = () => `https://t.me/${S.me.bot}?start=ref_${S.me.id}`;
function shareRef() {
  const url = "https://t.me/share/url?url=" + encodeURIComponent(refLink()) + "&text=" + encodeURIComponent("Slayd va referatni AI bilan tayyorlang");
  tg ? tg.openTelegramLink(url) : copy(refLink());
}

function profileView() {
  const m = S.me;
  return [h("h1", {}, "Profil"),
    h("div", { class: "card", style: "margin-top:14px" },
      h("div", { class: "row" }, h("span", { class: "sub" }, "Ism"), h("b", {}, m.name)),
      h("div", { class: "row" }, h("span", { class: "sub" }, "ID"), h("b", {}, String(m.id))),
      h("div", { class: "row" }, h("span", { class: "sub" }, "Balans"), h("b", {}, fmt(m.balance)))),
    h("h2", {}, "Ilovani baholang"), rateCard(),
    h("h2", {}, "Yordam"),
    h("div", { class: "card" }, h("p", { class: "sub" }, "Savol yoki muammo bo'lsa, adminga yozing."),
      m.admin ? h("button", { class: "btn ghost", style: "margin-top:12px", onclick: () => tg ? tg.openTelegramLink("https://t.me/" + m.admin.replace("@", "")) : 0 }, "Adminga yozish " + m.admin) : null)];
}

function render() {
  const v = { home, jobs: jobsView, wallet: walletView, profile: profileView }[S.tab]();
  $("view").replaceChildren(...v); renderNav(); window.scrollTo(0, 0);
  if (S.tab === "jobs") loadJobs();
  if (S.tab === "wallet") { loadTopups(); refreshMe(); }
}
async function loadJobs() { try { S.jobs = await api("/api/jobs"); if (S.tab === "jobs") $("view").replaceChildren(...jobsView()); } catch (e) {} }
setInterval(() => { if (S.tab === "jobs" && S.jobs.some(j => j.status === "running")) loadJobs(); }, 8000);

const sheet = { open(nodes) { $("panel").replaceChildren(...nodes); $("sheet").classList.add("open"); }, close() { $("sheet").classList.remove("open"); } };
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") sheet.close(); });

function openPicker() {
  sheet.open([h("h1", {}, "Nima yaratamiz?"), h("h2", {}, "Asosiy"), h("div", { class: "grid" }, S.tools.filter(t => t.group === "main").map(tile)),
    h("h2", {}, "Boshqa"), h("div", { class: "grid" }, S.tools.filter(t => t.group === "more").map(tile))]);
}

function loadMeta() { try { return JSON.parse(localStorage.getItem("meta") || "{}"); } catch (e) { return {}; } }
function openTool(t) {
  if (t.enabled === false) return toast("Tez orada qo'shiladi 🚀");
  if (t.kind === "chat") return sheet.open([h("h1", {}, t.title), h("p", { class: "sub", style: "margin:8px 0 16px" }, "AI yordamchi bot chatida ishlaydi. Kuniga 10 ta savol tekin."),
    h("button", { class: "btn", onclick: () => tg ? tg.close() : sheet.close() }, "Botga o'tish")]);
  const sv = loadMeta();
  S.form = { tool: t, topic: "", lang: "uz", opt: 0, palette: "blue", logo: null, logoPrev: null,
    meta: { author: sv.author || S.me.name, org: sv.org || "", subject: sv.subject || "" } };
  drawForm();
}
const PAL = [["blue", "Ko'k", "2E86DE"], ["green", "Yashil", "27AE60"], ["purple", "Binafsha", "8E5CF7"], ["orange", "To'q sariq", "F39C12"]];
async function shrinkLogo(file) {
  const bmp = await createImageBitmap(file), k = Math.min(1, 400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/png"); return { b64: url.split(",")[1], url };
}
function drawForm() {
  const f = S.form, t = f.tool, o = t.options[f.opt], max = o.max || t.max_len || 1500;
  const go = h("button", { class: "btn", style: "width:100%;margin-top:18px", onclick: submit }, "Yaratish · " + fmt(o.price));
  go.disabled = f.topic.trim().length < 3;
  const ta = h("textarea", { placeholder: t.ask, maxlength: max, style: t.max_len > 1500 ? "min-height:160px" : "", oninput: e => { f.topic = e.target.value; go.disabled = f.topic.trim().length < 3; } }, f.topic);
  const inp = (key, ph) => h("input", { class: "inp", placeholder: ph, maxlength: 100, value: f.meta[key] || "", oninput: e => { f.meta[key] = e.target.value; } });
  const logoIn = h("input", { type: "file", accept: "image/*", style: "display:none", onchange: async e => {
    const file = e.target.files[0]; if (!file) return;
    try { const r = await shrinkLogo(file); f.logo = r.b64; f.logoPrev = r.url; drawForm(); } catch (err) { toast("Rasmni o'qib bo'lmadi"); }
  } });
  sheet.open([h("h1", {}, t.title), h("h2", {}, t.key === "tarjimon" ? "Matn" : "Mavzu"), ta,
    h("h2", {}, t.key === "tarjimon" ? "Qaysi tilga" : "Til"),
    h("div", { class: "chips" }, Object.entries(S.langs).map(([k, v]) => h("button", { class: "opt" + (f.lang === k ? " on" : ""), onclick: () => { f.lang = k; drawForm(); } }, v))),
    t.kind === "pptx" ? [h("h2", {}, "Rang"), h("div", { class: "chips" }, PAL.map(([k, name, c]) => h("button", { class: "opt" + (f.palette === k ? " on" : ""), onclick: () => { f.palette = k; drawForm(); } },
      h("span", { style: "display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;background:#" + c }), name)))] : null,
    h("h2", {}, "Hajm"), h("div", { class: "opts" }, t.options.map((x, i) => h("button", { class: "opt" + (f.opt === i ? " on" : ""), onclick: () => { f.opt = i; drawForm(); } },
      h("span", {}, x.label.replace(/ · .*/, "")), h("span", {}, fmt(x.price))))),
    t.meta ? [h("h2", {}, "Muallif ma'lumotlari (ixtiyoriy)"), inp("author", "Muallif (ism familiya)"), inp("org", "OTM yoki maktab nomi"), inp("subject", "Fan nomi")] : null,
    t.logo ? [logoIn, h("button", { class: "btn ghost", style: "width:100%;margin-top:10px", onclick: () => logoIn.click() }, f.logo ? "Logotipni almashtirish" : "Logotip yuklash (ixtiyoriy)"),
      f.logoPrev ? h("img", { class: "thumb", style: "max-height:70px", src: f.logoPrev, alt: "Logotip" }) : null] : null,
    go]);
}
async function submit(e) {
  const f = S.form; e.target.disabled = true;
  try {
    try { localStorage.setItem("meta", JSON.stringify(f.meta)); } catch (x) {}
    const r = await api("/api/create", { tool: f.tool.key, topic: f.topic.trim(), lang: f.lang, opt: f.opt, palette: f.palette,
      meta: f.tool.meta ? f.meta : {}, logo: f.tool.logo && f.logo ? f.logo : "" });
    S.me.balance = r.balance; sheet.close(); toast("Tayyorlanmoqda. Fayl bot chatiga keladi"); setTab("jobs");
  } catch (err) {
    e.target.disabled = false; toast(err.message);
    if (/Balans/.test(err.message)) { sheet.close(); setTab("wallet"); }
  }
}
function rateCard() {
  if (S.me.rated) return h("div", { class: "card sub" }, "Baholaganingiz uchun rahmat! 🙏");
  let stars = 0;
  const box = h("div", { class: "chips" }), ta = h("textarea", { placeholder: "Ilova sizga qanday yordam berdi? Nimani yaxshilash kerak?", style: "margin-top:12px" });
  const draw = () => box.replaceChildren(...[1, 2, 3, 4, 5].map(i => h("button", { class: "opt" + (i <= stars ? " on" : ""), onclick: () => { stars = i; draw(); } }, "⭐")));
  draw();
  const btn = h("button", { class: "btn", style: "width:100%;margin-top:12px", onclick: async () => {
    if (!stars || ta.value.trim().length < 5) return toast("Yulduz tanlang va fikringizni yozing");
    btn.disabled = true;
    try { const r = await api("/api/rate", { stars, text: ta.value.trim() }); S.me.balance = r.balance; S.me.rated = true; toast("Rahmat! +500 so'm qo'shildi"); render(); }
    catch (err) { btn.disabled = false; toast(err.message); }
  } }, "Yuborish va +500 so'm olish");
  return h("div", { class: "card" }, h("p", { class: "sub", style: "margin-bottom:10px" }, "Baholang va +500 so'm bonus oling (kamida bitta hujjat yaratgan bo'lishingiz kerak)."), box, ta, btn);
}

(async function init() {
  if (!tg || !tg.initData) { $("view").replaceChildren(h("div", { class: "empty" }, h("p", {}, "Bu ilovani Telegram ichidan, botning \"Ilova\" tugmasi orqali oching."))); return; }
  try {
    const [me, tl] = await Promise.all([api("/api/me"), api("/api/tools")]);
    S.me = me; S.tools = tl.tools; S.langs = tl.langs;
    const q = new URLSearchParams(location.search);
    if (q.get("tab") && ["home", "jobs", "wallet", "profile"].includes(q.get("tab"))) S.tab = q.get("tab");
    render();
    const tool = S.tools.find(x => x.key === q.get("tool"));
    if (tool) openTool(tool); else if (q.get("picker")) openPicker();
  } catch (e) { $("view").replaceChildren(h("div", { class: "empty" }, h("p", {}, e.message))); }
})();
</script>
</body>
